# The official entrypoint expands only BACKEND_UPSTREAM and TRUSTED_PROXY_CIDR.
# Access logs deliberately omit URL paths and query parameters (personal invitations).
log_format survey_safe '$remote_addr [$time_local] $request_method $status $body_bytes_sent $request_time';
map $uri $survey_cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    default "no-store";
}
geo $realip_remote_addr $survey_trusted_proxy {
    default 0;
    ${TRUSTED_PROXY_CIDR} 1;
}
map "$survey_trusted_proxy:$http_x_forwarded_proto" $survey_forwarded_proto {
    default $scheme;
    "1:https" https;
    "1:http" http;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /dev/stdout survey_safe;
    error_log /dev/stderr crit;
    client_max_body_size 128k;
    # Resolve the stable private alias again after independent backend redeploys.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $survey_backend_upstream ${BACKEND_UPSTREAM};
    set_real_ip_from ${TRUSTED_PROXY_CIDR};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # Flask-WTF checks same-origin Referer on HTTPS. Cross-origin requests still
    # receive no referrer, so personal invitation paths never reach Turnstile.
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cache-Control $survey_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
    location /api/ {
        proxy_pass $survey_backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $survey_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_hide_header Content-Security-Policy;
    }
    location /admin {
        proxy_pass $survey_backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $survey_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
    }
    location /public/ {
        proxy_pass $survey_backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $survey_forwarded_proto;
    }
    location /static/ {
        proxy_pass $survey_backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $survey_forwarded_proto;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
