# The API origin in the CSP is filled from VITE_API_URL during the Docker build.
# Access logs deliberately omit URL paths and query parameters (personal invitations).
log_format survey_safe '$remote_addr [$time_local] $request_method $status $body_bytes_sent $request_time';
map $uri $survey_cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    default "no-store";
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /dev/stdout survey_safe;
    error_log /dev/stderr crit;
    client_max_body_size 128k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # Send only the origin to the API, never a personal invitation path.
    add_header Referrer-Policy strict-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cache-Control $survey_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' __API_ORIGIN__ https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
    location /api/ { return 404; }
    location /admin { return 404; }
    location /public/ { return 404; }
    location /static/ { return 404; }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
